<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="ShopEase Bangladesh: Discover genuine electronics, fashion, home essentials, and lifestyle products with Cash on Delivery and fast doorstep delivery.">
  <meta name="keywords" content="ShopEase, online shopping bangladesh, ecommerce dhaka, electronics, fashion, cash on delivery">
  <meta name="theme-color" content="#FF6B35">

  <!-- Open Graph / Social SEO -->
  <meta property="og:title" content="ShopEase | Online Shopping in Bangladesh">
  <meta property="og:description" content="Shop authentic products with guaranteed delivery and Cash on Delivery across Bangladesh.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ShopEase">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ShopEase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>ShopEase | Online Shopping in Bangladesh</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      color: #111827;
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }
    .brand-badge {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FF6B35 0%, #E55A24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.28);
      margin-bottom: 18px;
    }
    .brand-badge svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 107, 53, 0.15);
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-title {
      margin-top: 14px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #111827;
    }
    .loading-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #6B7280;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24">
        <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-title">ShopEase</div>
    <div class="loading-subtitle">Loading shopping experience...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 350);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
